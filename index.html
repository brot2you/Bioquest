<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10263c"><title>BIOQUEST • Science Adventure</title><style>
:root{--navy:#10263c;--blue:#183e57;--teal:#14c9ad;--yellow:#ffcd57;--cream:#f6f5ef;--ink:#173148;--muted:#607586;--line:#dce7e8}*{box-sizing:border-box}body{margin:0;background:#eaf1ef;color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ff9c36;outline-offset:3px}.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}aside{background:var(--navy);color:white;padding:30px 18px;display:flex;flex-direction:column;gap:24px}.logo{font-size:27px;font-weight:1000;letter-spacing:-1.5px;padding:0 10px}.logo span{color:var(--teal)}.tag{color:#a9c6d0;font-size:12px;letter-spacing:2px;font-weight:800;padding:0 10px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#c8dbe2;text-align:left;padding:13px 15px;border-radius:13px;font-weight:750}.nav button.active,.nav button:hover{background:#24516b;color:#fff}.aside-foot{margin-top:auto;padding:16px;background:#19394f;border-radius:16px;color:#b7d2db;font-size:13px}main{min-width:0}.top{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,64px);background:white;border-bottom:1px solid var(--line)}.top strong{font-size:14px}.pill{display:inline-block;border-radius:30px;padding:7px 13px;background:#e6f7f3;color:#087e6b;font-size:13px;font-weight:850}.content{max-width:1160px;margin:auto;padding:clamp(20px,4vw,52px)}.eyebrow{color:#008e83;letter-spacing:2px;text-transform:uppercase;font-size:12px;font-weight:900}.hero{position:relative;overflow:hidden;border-radius:27px;background:radial-gradient(circle at 82% 25%,#316b81 0,#204c64 30%,transparent 31%),linear-gradient(125deg,#12324d,#175b6c);color:white;min-height:330px;padding:clamp(26px,5vw,55px);display:flex;align-items:center;box-shadow:0 18px 40px #13384b22}.hero:after{content:"";position:absolute;right:7%;bottom:-80px;width:330px;height:270px;border:38px solid #ffffff12;border-radius:50%;transform:rotate(-20deg)}.hero-copy{position:relative;z-index:1;max-width:600px}.hero h1{font-size:clamp(34px,5vw,61px);line-height:1.07;letter-spacing:-2px;margin:10px 0 17px}.hero p{color:#c8e2e9;max-width:490px}.primary,.secondary{border:0;border-radius:13px;padding:13px 20px;font-weight:850}.primary{background:var(--yellow);color:#173148}.secondary{background:#eaf4f3;color:#145d65}.hero .primary{margin-top:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 17px}.section-head h2{margin:0;font-size:23px;letter-spacing:-.6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 5px 15px #17314808}.world{position:relative;min-height:220px;display:flex;flex-direction:column;align-items:flex-start;justify-content:end;overflow:hidden}.world:before{content:"";position:absolute;right:-35px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff80}.world .symbol{position:absolute;right:20px;top:17px;font-size:64px;line-height:1}.world h3{margin:0 0 5px;font-size:22px}.world p{margin:0 0 13px;font-size:13px;color:#456170}.world button{border:0;background:#fff;padding:8px 13px;border-radius:10px;font-weight:850;color:#173148}.world.volcano{background:#ffe7d7}.world.living{background:#daf6e5}.world.body{background:#e4e5ff}.world.locked{opacity:.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.stat{background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line)}.stat b{display:block;font-size:28px}.stat small{color:var(--muted)}.mission-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.mission{display:flex;flex-direction:column;gap:12px;min-height:190px}.mission .num{font-weight:900;color:#008d84;font-size:13px}.mission h3{margin:0;font-size:19px}.mission p{margin:0;color:var(--muted);font-size:14px;flex:1}.mission button{align-self:start}.progress{height:9px;background:#dfe9e8;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--teal);transition:width .3s}.panel{max-width:780px;margin:auto}.question{font-size:clamp(23px,3vw,33px);line-height:1.25;letter-spacing:-.7px}.answers{display:grid;gap:10px;margin:23px 0}.answer{border:2px solid #dce8e8;background:white;text-align:left;border-radius:14px;padding:16px 18px;font-weight:700}.answer:hover:not(:disabled){border-color:#14a998}.answer.selected{border-color:#13a995;background:#e4faf3}.answer:disabled{cursor:default}.feedback{padding:18px;border-radius:15px;background:#e6f7f0;border-left:5px solid #0eaa8e;margin:18px 0}.feedback.bad{background:#fff3e8;border-color:#e89b39}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.small{font-size:13px;color:var(--muted)}.notebook{display:grid;gap:12px}.entry{border-left:4px solid #17b8a5}.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.badge-card{text-align:center}.badge-icon{font-size:48px}.badge-card.dim{opacity:.4}.empty{padding:25px;background:#fff;border:1px dashed #bdd3d3;border-radius:16px;color:#607586}.mobile-nav{display:none}@media(max-width:900px){.shell{display:block}aside{display:none}.top{height:68px;padding:0 20px}.content{padding:20px 17px 100px}.hero{min-height:320px}.grid,.mission-list{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;background:#10263c;padding:9px 8px calc(9px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -5px 22px #0002}.mobile-nav button{background:none;border:0;color:#c3d6dc;font-size:11px;font-weight:750;padding:7px 5px;min-width:60px}.mobile-nav button.active{color:#ffcd57}}@media(max-width:570px){.grid,.mission-list,.badge-grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:23px}.hero{min-height:360px;padding:28px}.hero h1{font-size:39px}.world{min-height:190px}.section-head h2{font-size:21px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="shell"><aside><div><div class="logo">BIO<span>QUEST</span></div><div class="tag">SCIENCE ADVENTURE</div></div><nav class="nav" id="sideNav"></nav><div class="aside-foot">🔬 Observer · Expérimenter · Comprendre<br><br>Cycle 4 · SVT</div></aside><main><header class="top"><strong>🌍 Académie des explorateurs</strong><span class="pill" id="topXp">0 XP</span></header><div class="content" id="app"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav><script>
const missions=[
{title:'Le volcan se réveille',desc:'Identifier les premiers indices d’une activité volcanique.',q:'Quel indice peut signaler qu’un volcan devient plus actif ?',choices:['Une augmentation de petits séismes','La disparition des nuages','Un changement de saison'],a:0,why:'Les mouvements de magma peuvent provoquer des séismes. Les scientifiques suivent aussi les gaz et la déformation du sol.',fact:'La surveillance volcanique combine plusieurs types de mesures.',badge:'🌋'},
{title:'Sous la montagne',desc:'Découvrir le magma et les roches.',q:'Quelle est la différence entre magma et lave ?',choices:['La lave est toujours plus froide que l’eau','La lave est du magma arrivé à la surface','Le magma est une roche solide uniquement'],a:1,why:'On parle de magma en profondeur et de lave lorsqu’il atteint la surface. Le magma contient aussi des gaz et parfois des cristaux.',fact:'Le magma est un mélange de matière fondue, de cristaux et de gaz.',badge:'🪨'},
{title:'Les deux éruptions',desc:'Comparer des comportements volcaniques.',q:'Une éruption explosive est souvent favorisée par…',choices:['Un magma visqueux riche en gaz','Une absence totale de gaz','Une pluie intense'],a:0,why:'Un magma visqueux laisse plus difficilement s’échapper les gaz, ce qui peut augmenter la pression.',fact:'Les caractéristiques du magma influencent le type d’éruption.',badge:'💥'},
{title:'Alerte sismique',desc:'Lire des observations scientifiques.',q:'Une station mesure 2, puis 7, puis 15 petits séismes par jour près du volcan. Que conclure ?',choices:['Une éruption est certaine demain','L’activité sismique augmente, il faut croiser les données','Le volcan est forcément éteint'],a:1,why:'Une hausse de la sismicité mérite une attention accrue, mais ne suffit pas à prévoir une éruption à une date précise.',fact:'Une donnée isolée ne permet pas de prédire exactement une éruption.',badge:'📈'},
{title:'Gaz mystérieux',desc:'Comprendre l’intérêt des mesures de gaz.',q:'Pourquoi mesurer les gaz émis par un volcan ?',choices:['Pour connaître la météo du mois prochain','Pour détecter des changements possibles de l’activité magmatique','Pour mesurer la vitesse des océans'],a:1,why:'La composition et la quantité des gaz peuvent évoluer lorsque le système magmatique change.',fact:'Les gaz volcaniques font partie des indicateurs de surveillance.',badge:'🧪'},
{title:'La carte des risques',desc:'Prendre des décisions face aux aléas.',q:'Une vallée est exposée à des coulées de boue volcanique. Quelle mesure est pertinente ?',choices:['Préparer des itinéraires d’évacuation','Attendre au bord de la rivière pour observer','Ignorer les consignes officielles'],a:0,why:'L’aménagement, la surveillance, l’information et les plans d’évacuation réduisent l’exposition des populations.',fact:'Le risque dépend de l’aléa mais aussi de l’exposition et de la vulnérabilité.',badge:'🗺️'},
{title:'La roche raconte',desc:'Relier refroidissement et texture.',q:'Pourquoi certaines roches volcaniques présentent-elles de très petits cristaux ?',choices:['Elles refroidissent souvent rapidement','Elles sont faites uniquement de sable','Elles ne contiennent aucun minéral'],a:0,why:'Le refroidissement rapide en surface limite généralement la croissance des cristaux.',fact:'La texture d’une roche renseigne sur son histoire de refroidissement.',badge:'🔎'},
{title:'Plaques en mouvement',desc:'Comprendre où se forment les volcans.',q:'Où trouve-t-on de nombreux volcans actifs ?',choices:['Uniquement au centre des continents','Près de certaines limites de plaques tectoniques','Exclusivement dans les déserts'],a:1,why:'Une grande partie du volcanisme est liée aux limites de plaques, même si des volcans existent aussi au-dessus de points chauds.',fact:'Le volcanisme aide à comprendre la dynamique interne de la Terre.',badge:'🌍'},
{title:'Conseil scientifique',desc:'Formuler une conclusion argumentée.',q:'Sismicité en hausse, sol qui se déforme, gaz qui changent : quelle conclusion est la plus scientifique ?',choices:['Une éruption est absolument certaine dans une heure','Plusieurs indices suggèrent une évolution : renforcer la surveillance','Aucune donnée ne présente d’intérêt'],a:1,why:'Une conclusion scientifique s’appuie sur plusieurs indices et exprime les incertitudes. La surveillance aide les autorités à prendre des décisions.',fact:'Une bonne conclusion distingue observation, interprétation et incertitude.',badge:'🏆'}
];
const key='bioquest_v2_progress';let state;try{state=JSON.parse(localStorage.getItem(key))||{done:[],xp:0}}catch{state={done:[],xp:0}};if(!Array.isArray(state.done))state={done:[],xp:0};let page='home',current=0,chosen=null,checked=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(state))}function nav(to){page=to;chosen=null;checked=false;render();window.scrollTo(0,0)}function start(i){if(i>state.done.length){return}current=i;page='play';chosen=null;checked=false;render();window.scrollTo(0,0)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const links=[['home','⌂','Accueil'],['missions','◈','Missions'],['journal','▤','Carnet'],['rewards','★','Badges']];function renderNav(){for(let id of ['sideNav','mobileNav'])$(id).innerHTML=links.map(([p,ic,label])=>`<button class="${page===p?'active':''}" onclick="nav('${p}')">${ic} ${label}</button>`).join('')}function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow" style="color:#65f0d4">Bienvenue, explorateur scientifique</div><h1>La science est<br>une aventure.</h1><p>Explore des mondes mystérieux, rassemble des indices et mène tes propres enquêtes scientifiques.</p><button class="primary" onclick="nav('missions')">Commencer l’exploration →</button></div></section><div class="section-head"><h2>Choisis ton univers</h2><span class="small">1 univers disponible</span></div><div class="grid"><div class="card world volcano"><div class="symbol">🌋</div><h3>L’île des volcans</h3><p>9 enquêtes · Terre et risques</p><button onclick="nav('missions')">Explorer →</button></div><div class="card world living locked"><div class="symbol">🌱</div><h3>Le monde vivant</h3><p>À venir · Biodiversité</p><span class="small">Bientôt disponible</span></div><div class="card world body locked"><div class="symbol">🧬</div><h3>Le corps humain</h3><p>À venir · Santé et fonctions</p><span class="small">Bientôt disponible</span></div></div><div class="stats"><div class="stat"><b>${state.done.length}/9</b><small>Missions réussies</small></div><div class="stat"><b>${state.xp}</b><small>Points XP</small></div><div class="stat"><b>${state.done.length}</b><small>Badges gagnés</small></div></div>`}function list(){return `<div class="eyebrow">Mon expédition</div><h1>L’île des volcans 🌋</h1><p class="small">Observe, réfléchis et construis tes connaissances. Chaque mission débloque la suivante.</p><div class="progress" aria-label="Progression"><div style="width:${state.done.length/9*100}%"></div></div><div class="section-head"><h2>Les 9 missions</h2><span class="pill">${state.done.length}/9 terminées</span></div><div class="mission-list">${missions.map((m,i)=>`<article class="card mission"><div class="num">MISSION ${String(i+1).padStart(2,'0')} · ${state.done.includes(i)?'✓ Terminée':i<=state.done.length?'Disponible':'🔒 Verrouillée'}</div><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(m.desc)}</p><button class="${i<=state.done.length?'primary':'secondary'}" ${i>state.done.length?'disabled':''} onclick="start(${i})">${state.done.includes(i)?'Rejouer':i<=state.done.length?'Lancer →':'À débloquer'}</button></article>`).join('')}</div>`}function play(){let m=missions[current];return `<div class="panel"><button class="secondary" onclick="nav('missions')">← Retour aux missions</button><div class="section-head"><span class="eyebrow">Mission ${current+1} / 9</span><span class="pill">${state.xp} XP</span></div><div class="card" style="padding:clamp(22px,4vw,38px)"><div class="eyebrow">Enquête scientifique</div><h1>${escapeHtml(m.title)}</h1><p class="small">${escapeHtml(m.desc)}</p><h2 class="question">${escapeHtml(m.q)}</h2><div class="answers">${m.choices.map((a,i)=>`<button class="answer ${chosen===i?'selected':''}" ${checked?'disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(a)}</button>`).join('')}</div>${checked?`<div class="feedback ${chosen===m.a?'':'bad'}" role="status"><b>${chosen===m.a?'✓ Bonne réponse !':'À revoir : la bonne réponse est '+String.fromCharCode(65+m.a)+'.'}</b><p>${escapeHtml(m.why)}</p></div>`:''}<div class="controls">${!checked?`<button class="primary" ${chosen===null?'disabled':''} onclick="verify()">Vérifier ma réponse</button>`:chosen===m.a?`<button class="primary" onclick="complete()">${state.done.includes(current)?'Continuer →':'Valider la mission +100 XP →'}</button>`:`<button class="secondary" onclick="retry()">Réessayer</button>`}</div></div></div>`}function choose(i){if(!checked){chosen=i;render()}}function verify(){if(chosen!==null){checked=true;render()}}function retry(){chosen=null;checked=false;render()}function complete(){if(!state.done.includes(current)){state.done.push(current);state.done.sort((a,b)=>a-b);state.xp+=100;save()}page='success';render();window.scrollTo(0,0)}function success(){return `<div class="panel"><div class="card" style="text-align:center;padding:55px 25px"><div style="font-size:72px">🏅</div><div class="eyebrow">Mission accomplie</div><h1>Bravo, scientifique !</h1><h2>${escapeHtml(missions[current].title)}</h2><p>Nouvelle découverte dans ton carnet :<br><strong>${escapeHtml(missions[current].fact)}</strong></p><div class="pill">+100 XP lors de la première réussite · ${missions[current].badge} Badge acquis</div><div class="controls" style="justify-content:center"><button class="secondary" onclick="nav('journal')">Voir mon carnet</button><button class="primary" onclick="${current<8?`start(${current+1})`:`nav('rewards')`}">${current<8?'Mission suivante →':'Voir mes badges →'}</button></div></div></div>`}function journal(){return `<div class="eyebrow">Mes découvertes</div><h1>Carnet scientifique</h1><p>Retrouve les notions découvertes au cours de tes enquêtes.</p><div class="notebook">${state.done.length?state.done.map(i=>`<article class="card entry"><strong>${missions[i].badge} ${escapeHtml(missions[i].title)}</strong><p>${escapeHtml(missions[i].fact)}</p></article>`).join(''):'<div class="empty">Ton carnet est vide. Termine une mission pour enregistrer ta première découverte.</div>'}</div><div class="controls"><button class="secondary" onclick="exportProgress()">Exporter ma progression</button><button class="secondary" onclick="$(\'importFile\').click()">Importer une sauvegarde</button><input id="importFile" type="file" accept="application/json" hidden onchange="importProgress(event)"></div>`}function rewards(){return `<div class="eyebrow">Collection scientifique</div><h1>Mes badges</h1><p>Un badge est attribué à chaque enquête résolue.</p><div class="badge-grid">${missions.map((m,i)=>`<div class="card badge-card ${state.done.includes(i)?'':'dim'}"><div class="badge-icon">${state.done.includes(i)?m.badge:'🔒'}</div><strong>${escapeHtml(m.title)}</strong><div class="small">${state.done.includes(i)?'Débloqué':'À découvrir'}</div></div>`).join('')}</div>`}function render(){renderNav();$('topXp').textContent=state.xp+' XP';$('app').innerHTML=page==='home'?home():page==='missions'?list():page==='play'?play():page==='success'?success():page==='journal'?journal():rewards()}function exportProgress(){const blob=new Blob([JSON.stringify({version:2,done:state.done,xp:state.xp},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bioquest-progression.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importProgress(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.done)||!data.done.every(n=>Number.isInteger(n)&&n>=0&&n<9))throw Error('Format incorrect');let done=[...new Set(data.done)].sort((a,b)=>a-b);if(done.some((n,i)=>n!==i))throw Error('Progression non continue');state={done,xp:done.length*100};save();render();alert('Progression importée.')}catch(err){alert('Sauvegarde invalide : '+err.message)}}render();
</script></body></html>

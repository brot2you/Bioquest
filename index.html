<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062f52"><title>BIOQUEST — L'archipel des sciences</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:#062a45}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe56b;outline-offset:3px}.hidden{display:none!important}.world{position:relative;min-height:100svh;background-image:linear-gradient(180deg,rgba(0,31,58,.44),transparent 25%,transparent 60%,rgba(0,20,40,.36)),url('assets/archipel-desktop.jpg');background-position:center;background-size:cover;overflow:hidden}.top{position:absolute;z-index:4;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(15px,3vw,46px);background:linear-gradient(#03253aa8,transparent)}.logo{font-size:clamp(26px,3.3vw,46px);font-weight:1000;letter-spacing:1.5px;text-shadow:0 3px 0 #06395e,0 5px 18px #001c3b}.logo b{color:#ffe36b}.tag{font-size:12px;font-weight:800;letter-spacing:2px;color:#dbf7ff}.tools{display:flex;gap:8px;align-items:center}.pill{border:1px solid #a6eafa80;background:#063a64dd;color:#fff;border-radius:100px;padding:10px 14px;font-weight:800;box-shadow:0 5px 16px #001a3280}.pill:hover,.island:hover{filter:brightness(1.15)}.island{position:absolute;z-index:2;transform:translate(-50%,-50%);border:2px solid #ffffffb0;background:#043958c9;color:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 8px 0 #06263c9c,0 8px 24px #001a2eaa;min-width:165px;text-align:center;transition:transform .2s}.island:hover{transform:translate(-50%,-54%)}.island strong{display:block;font-size:clamp(16px,1.5vw,23px);text-shadow:0 2px 2px #000}.island small{display:block;font-size:12px;margin-top:3px}.volcano{left:19%;top:52%;border-color:#ffbd74}.living{left:51%;top:55%;border-color:#9df5a5}.body{left:82%;top:55%;border-color:#b5ddff}.bottom{position:absolute;z-index:3;bottom:18px;left:50%;transform:translateX(-50%);background:#032a48d9;border:1px solid #b4f5ff88;border-radius:30px;padding:10px 20px;font-size:14px;font-weight:750;white-space:nowrap;text-align:center}.screen{min-height:100svh;padding:20px;background:radial-gradient(circle at top,#146a92,#073c60 48%,#06283f);}.shell{max-width:1080px;margin:auto}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.bar h1{font-size:clamp(23px,4vw,38px);margin:0}.back{border:1px solid #9ad9ef;background:#064263;color:white;border-radius:14px;padding:12px 18px;font-weight:800}.intro{background:#ffffff12;border:1px solid #b7e8ff4f;border-radius:20px;padding:20px;margin:14px 0 22px;line-height:1.5}.mission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.mission{background:#f4fcff;color:#07324e;border-radius:20px;padding:20px;border:3px solid #8adce8;box-shadow:0 8px 0 #00263d}.mission.lock{opacity:.68}.mission h3{margin:8px 0}.mission p{min-height:44px;font-size:14px;line-height:1.4}.mission button,.primary{border:0;background:#ffcb4b;color:#15334a;padding:12px 16px;border-radius:12px;font-weight:900}.mission button:disabled{opacity:.5;cursor:not-allowed}.num{font-size:12px;font-weight:900;letter-spacing:1px;color:#13728b}.panel{max-width:760px;margin:26px auto;background:#f7fcff;color:#07324e;padding:clamp(18px,4vw,36px);border-radius:24px;box-shadow:0 12px 0 #00243b}.panel h2{margin-top:0}.choices{display:grid;gap:12px;margin:22px 0}.choice{padding:16px;border:2px solid #9bcbdc;background:#e9f7ff;border-radius:14px;text-align:left;color:#093e5e;font-weight:700}.choice.selected{border-color:#117aa6;background:#d4efff}.choice.correct{background:#cbf5d3;border-color:#319a54}.choice.wrong{background:#ffe2db;border-color:#c95746}.feedback{background:#e8f2fa;border-radius:14px;padding:18px;line-height:1.55;margin-top:14px}.reward{font-size:22px;font-weight:900;color:#087f64}.notice{font-size:13px;color:#a8d5e9}.progress{font-weight:900;color:#ffdb73}@media(max-width:700px){.world{background-image:linear-gradient(180deg,rgba(0,28,51,.55),transparent 28%,transparent 72%,rgba(0,20,40,.4)),url('assets/archipel-mobile.jpg');background-position:center center}.top{padding:15px;align-items:flex-start}.logo{font-size:29px}.tag{font-size:9px}.tools{flex-direction:column;align-items:flex-end}.pill{font-size:12px;padding:8px 11px}.island{min-width:150px;padding:10px 12px}.island strong{font-size:16px}.volcano{left:27%;top:34%}.living{left:42%;top:67%}.body{left:77%;top:47%}.bottom{bottom:20px;white-space:normal;width:calc(100% - 30px);font-size:12px}.screen{padding:14px}.panel{margin:16px auto}}
</style></head><body>
<main id="home" class="world"><header class="top"><div><div class="logo">BIO<b>QUEST</b></div><div class="tag">L'ARCHIPEL DES SCIENCES</div></div><div class="tools"><button class="pill" onclick="openPage('journal')">📖 Carnet</button><button class="pill" onclick="openPage('rewards')">🏅 Récompenses</button></div></header><button class="island volcano" onclick="openPage('volcano')"><strong>🌋 Terre & volcans</strong><small>9 missions • Jouer</small></button><button class="island living" onclick="openPage('living')"><strong>🌿 Monde vivant</strong><small>À découvrir</small></button><button class="island body" onclick="openPage('body')"><strong>🔬 Corps humain</strong><small>À découvrir</small></button><div class="bottom">Choisis une île pour commencer ton aventure scientifique</div></main>
<section id="page" class="screen hidden"><div class="shell"><div class="bar"><button class="back" onclick="goHome()">← Archipel</button><h1 id="pageTitle"></h1><div class="progress" id="counter"></div></div><div id="content"></div></div></section>
<script>
const missions=[
['Un volcan se réveille','Identifier les indices d’une activité volcanique.','Quel indice peut signaler une activité volcanique ?',['Une augmentation de la sismicité','La couleur de la mer','La durée du jour'],0,'Les séismes peuvent traduire des mouvements de magma ou des ruptures de roches. Ils ne permettent pas à eux seuls de prédire une éruption.'],
['Sous la montagne','Comprendre l’origine du magma.','Qu’est-ce que le magma ?',['De la roche totalement solide','De la roche partiellement ou totalement fondue, contenant parfois des gaz et cristaux','De l’eau très chaude'],1,'Le magma est un matériau rocheux fondu, souvent avec des cristaux et des gaz.'],
['Magma ou lave ?','Distinguer deux termes scientifiques.','Comment appelle-t-on le magma lorsqu’il atteint la surface ?',['La lave','La cendre','Le granite'],0,'Le magma arrivé à la surface est appelé lave, généralement après une partie du dégazage.'],
['Les traces du passé','Observer des roches volcaniques.','Quelle roche volcanique peut présenter de nombreuses petites cavités dues aux gaz ?',['Le calcaire','Le basalte vacuolaire','Le marbre'],1,'Les bulles de gaz piégées dans la lave peuvent laisser des cavités dans la roche refroidie.'],
['À l’écoute du sol','Interpréter un signal sismique.','Quel instrument enregistre les mouvements du sol ?',['Le thermomètre','Le pluviomètre','Le sismomètre'],2,'Un sismomètre détecte et enregistre les mouvements du sol, notamment lors de séismes.'],
['Deux styles d’éruption','Comparer des manifestations volcaniques.','Une éruption explosive se caractérise souvent par…',['Des projections de cendres et de fragments','L’absence totale de gaz','Une absence de danger'],0,'La viscosité du magma et les gaz influencent le style éruptif. Les phénomènes varient selon les volcans.'],
['La carte des risques','Raisonner sur la prévention.','Pourquoi cartographie-t-on les zones exposées aux aléas volcaniques ?',['Pour décorer les cartes','Pour mieux préparer la protection des populations','Pour empêcher les séismes'],1,'Les cartes d’aléas aident à planifier la surveillance, l’information et les mesures de protection.'],
['Mission surveillance','Croiser plusieurs observations.','Quel ensemble d’observations aide le mieux à surveiller un volcan ?',['Séismes, déformations du sol et émissions de gaz','Uniquement la météo','Uniquement la couleur des roches'],0,'La surveillance combine plusieurs mesures. Aucune ne garantit une prévision exacte de l’éruption.'],
['Conseil scientifique','Conclure à partir des données.','Des séismes augmentent, mais aucune autre mesure ne change. Quelle conclusion est la plus rigoureuse ?',['Une éruption est certaine demain','Le volcan est forcément éteint','Il faut poursuivre la surveillance et croiser les données'],2,'Un indice isolé ne suffit pas à conclure. Les scientifiques confrontent les observations et indiquent leurs incertitudes.']
];
let completed=new Set();try{completed=new Set(JSON.parse(localStorage.getItem('bioquest-v3')||'[]'))}catch(e){}let active=-1,choice=-1,answered=false;
function save(){localStorage.setItem('bioquest-v3',JSON.stringify([...completed]))}function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('page').classList.add('hidden');window.scrollTo(0,0)}function page(title){document.getElementById('home').classList.add('hidden');document.getElementById('page').classList.remove('hidden');document.getElementById('pageTitle').textContent=title;document.getElementById('counter').textContent=completed.size+'/9 missions';window.scrollTo(0,0)}
function openPage(type){if(type==='volcano'){page('🌋 Terre & volcans');document.getElementById('content').innerHTML='<div class="intro"><b>Expédition : l’île du volcan</b><p>Un volcan montre des signes d’activité. Deviens scientifique : observe les indices, compare les explications et prépare un rapport.</p><span class="notice">Les missions se débloquent dans l’ordre. Tes progrès restent enregistrés sur cet appareil.</span></div><div class="mission-grid">'+missions.map((m,i)=>{let unlocked=i===0||completed.has(i-1),done=completed.has(i);return `<article class="mission ${unlocked?'':'lock'}"><div class="num">ÉTAPE ${i+1} ${done?'• VALIDÉE ✓':''}</div><h3>${m[0]}</h3><p>${m[1]}</p><button ${unlocked?'':'disabled'} onclick="startMission(${i})">${done?'Rejouer':unlocked?'Commencer':'🔒 Verrouillée'}</button></article>`}).join('')+'</div>'}
else if(type==='journal'){page('📖 Mon carnet');document.getElementById('content').innerHTML='<div class="intro"><h2>Mes découvertes scientifiques</h2><p>Chaque mission réussie enrichit ton carnet.</p></div><div class="mission-grid">'+missions.filter((m,i)=>completed.has(i)).map(m=>`<article class="mission"><h3>${m[0]}</h3><p>${m[4]}</p></article>`).join('')+'</div>'+(completed.size?'':'<div class="intro">Ton carnet est encore vide. Commence par explorer le volcan !</div>')}
else if(type==='rewards'){page('🏅 Mes récompenses');document.getElementById('content').innerHTML=`<div class="panel"><h2>Explorateur scientifique</h2><p class="reward">⭐ ${completed.size*100} XP</p><p>🏅 ${completed.size} badge${completed.size>1?'s':''} de mission</p><p>🌋 ${completed.size}/9 missions accomplies</p><p>${completed.size===9?'Bravo ! Tu as terminé l’expédition volcanique.':'Poursuis tes recherches pour compléter ta collection.'}</p><button class="primary" onclick="openPage('volcano')">Voir les missions</button></div>`}
else{page(type==='living'?'🌿 Monde vivant':'🔬 Corps humain');document.getElementById('content').innerHTML='<div class="panel"><h2>Prochaine destination</h2><p>Ce monde est prévu pour une prochaine mise à jour. L’archipel est déjà prêt à accueillir ses missions et ses illustrations.</p><button class="primary" onclick="goHome()">Retour à l’archipel</button></div>'}}
function startMission(i){active=i;choice=-1;answered=false;page('🌋 Mission '+(i+1));let m=missions[i];document.getElementById('content').innerHTML=`<div class="panel"><div class="num">MISSION ${i+1} / 9</div><h2>${m[0]}</h2><p>${m[1]}</p><h3>${m[2]}</h3><div class="choices" id="choices">${m[3].map((c,j)=>`<button class="choice" onclick="pick(${j})" id="choice${j}">${c}</button>`).join('')}</div><button class="primary" id="validate" onclick="validate()" disabled>Valider ma réponse</button><div id="feedback"></div></div>`}
function pick(j){if(answered)return;choice=j;document.querySelectorAll('.choice').forEach((el,i)=>el.classList.toggle('selected',i===j));document.getElementById('validate').disabled=false}
function validate(){if(choice<0||answered)return;answered=true;let m=missions[active],ok=choice===m[4];document.querySelectorAll('.choice').forEach((el,i)=>{el.disabled=true;if(i===m[4])el.classList.add('correct');else if(i===choice)el.classList.add('wrong')});if(ok){completed.add(active);save()}document.getElementById('validate').classList.add('hidden');document.getElementById('feedback').innerHTML=`<div class="feedback"><b>${ok?'✓ Bonne réponse ! +100 XP':'À revoir : voici la réponse attendue.'}</b><p>${m[5]}</p><button class="primary" onclick="${ok?'openPage(\'volcano\')':'startMission('+active+')'}">${ok?'Retour aux missions':'Réessayer'}</button></div>`;document.getElementById('counter').textContent=completed.size+'/9 missions'}
</script></body></html>
